{% extends 'admindashboard.html' %}
{% block content %}
<h2>Contact Messages</h2>
<table class="table table-striped">
  <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Subject</th><th>Message</th></tr></thead>
  <tbody>
    {% for contact in contacts %}
      <tr><td>{{ contact.id }}</td><td>{{ contact.name }}</td><td>{{ contact.email }}</td><td>{{ contact.subject }}</td><td>{{ contact.message }}</td></tr>
    {% empty %}
      <tr><td colspan="5">No contact messages found.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
