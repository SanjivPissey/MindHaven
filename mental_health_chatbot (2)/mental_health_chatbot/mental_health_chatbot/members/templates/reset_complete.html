<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Complete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --accent-color: #1977cc;
        }

        .text-accent {
            color: var(--accent-color) !important;
        }

        .btn-accent {
            background-color: var(--accent-color);
            color: white;
            border: none;
        }

        .btn-accent:hover {
            background-color: #155fa0;
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh; background-color: #f8f9fa;">
<div class="card p-4 shadow" style="max-width: 400px;">
    <h4 class="text-center text-accent">Password Reset Successful</h4>
    <p class="text-center">Your password has been reset successfully.</p>
    <div class="text-center mt-3">
        <a href="/user_login" class="btn btn-accent">Login</a>
    </div>
</div>
</body>
</html>
