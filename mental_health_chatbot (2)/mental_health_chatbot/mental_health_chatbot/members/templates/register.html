<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | Pest Advisory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('/media/assets/img/about.webp');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Adjust the opacity for brightness control */
            z-index: 1;
        }
        
        .registration-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
    </style>
</head>
<body>
<div class="registration-card">
    <h2>Select Registration Type</h2>
    <div class="mt-4">
        <a href="/userregister" class="btn btn-primary me-3">User Registration</a>
        <a href="/psychologistregister" class="btn btn-success">Psychologist Registration</a>
    </div>
</div>
</body>
</html>
