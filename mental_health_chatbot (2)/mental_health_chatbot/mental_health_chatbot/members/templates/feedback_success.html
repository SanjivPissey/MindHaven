
{% block content %}
<style>
  :root {
    --default-font: "Roboto", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    --heading-font: "Poppins", sans-serif;
    --nav-font: "Raleway", sans-serif;
    --background-color: #ffffff;
    --default-color: #444444;
    --heading-color: #2c4964;
    --accent-color: #1977cc;
    --surface-color: #ffffff;
    --contrast-color: #ffffff;
  }

  body {
    font-family: var(--default-font);
    background-color: #f5f9fc;
    margin: 0;
    padding: 0;
  }

  .success-container {
    max-width: 600px;
    margin: 80px auto;
    background: var(--surface-color);
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    text-align: center;
  }

  .success-container h2 {
    font-family: var(--heading-font);
    color: var(--heading-color);
    font-size: 2rem;
    margin-bottom: 15px;
  }

  .success-container p {
    font-size: 1.1rem;
    color: var(--default-color);
    line-height: 1.6;
  }

  .back-btn {
    display: inline-block;
    margin-top: 25px;
    padding: 10px 25px;
    font-size: 1rem;
    background-color: var(--accent-color);
    color: var(--contrast-color);
    border: none;
    border-radius: 8px;
    text-decoration: none;
    transition: background-color 0.3s ease;
  }

  .back-btn:hover {
    background-color: #125ea7;
  }
</style>

<div class="success-container">
  <h2>Thank You!</h2>
  <p>Your feedback has been submitted successfully. We appreciate your time and input to help us improve.</p>
  <a href="{% url 'userdashboard' %}" class="back-btn">Go to Dashboard</a>
</div>
{% endblock %}
