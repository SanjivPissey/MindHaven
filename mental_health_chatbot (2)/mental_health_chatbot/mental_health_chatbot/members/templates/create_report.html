{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .container {
            max-width: 800px;
            margin-top: 50px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .input-group {
            border: 2px solid #87CEEB;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .input-group .form-control {
            border: none;
        }
        .input-group-text {
            background: #87CEEB;
            color: white;
            border: none;
        }
        .btn-primary {
            background-color: #87CEEB;
            border: none;
        }
        .btn-primary:hover {
            background-color: #6495ED;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Create Report for {{ user.fullname }}</h2>
        
        <form method="post" action="{% url 'generate_report' user.id %}">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="patient" class="form-label">Patient</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="patient" name="patient" value="{{ user.fullname }}" readonly>
                    <div class="input-group-text bg-primary text-white">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label for="date" class="form-label">Date</label>
                <div class="input-group">
                    <input type="date" class="form-control" id="date" name="date" value="{{ today|date:"Y-m-d" }}" required>
                    <div class="input-group-text bg-primary text-white">
                        <i class="fas fa-calendar"></i>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label for="summary" class="form-label">Summary</label>
                <div class="input-group">
                    <textarea class="form-control" id="summary" name="summary" rows="4" required></textarea>
                    <div class="input-group-text bg-primary text-white">
                        <i class="fas fa-paragraph"></i>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label for="recommendations" class="form-label">Recommendations</label>
                <div class="input-group">
                    <textarea class="form-control" id="recommendations" name="recommendations" rows="8" required></textarea>
                    <div class="input-group-text bg-primary text-white">
                        <i class="fas fa-lightbulb"></i>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'psychologist_dashboard' %}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Create Report
                </button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
