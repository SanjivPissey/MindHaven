


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MindEase</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lottie Animation Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
    

    <style>
        body {
            background: #f4f4f4;
            font-family: 'Poppins', sans-serif;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 500px;
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .login-box input {
            width: 100%;
            height:50%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .login-box button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #0056b3;
        }

        .animation-container {
            width: 300px;
            height: 300px;
            margin-right: 40px;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }

            .animation-container {
                margin-right: 0;
                margin-bottom: 20px;
            }
        }

        input[type="radio"] {
          width: 100%;
          height: 100%;
          accent-color: #007bff; /* Resets to default browser color */
      }

      .radio-group {
        display: flex;
        align-items: center;
        gap: 15px; /* Adjust spacing between items */
    }
    
    .radio-option {
        display: flex;
        align-items: center;
        gap: 5px; /* Space between radio and label */
    }
    
    .radio-option input[type="radio"] {
        width: auto;
        height: auto;
        margin: 0;
    }
    
    

    </style>
</head>

<body>

    <div class="container login-container">
        <!-- Lottie Animation -->
        <div class="animation-container">
            <div id="lottie-animation" style="width: 300px; height: 300px;"></div>
        </div>

        <!-- Login Form -->
        <div class="login-box">
          <h2>User Register</h2>
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }}" style="color: {% if message.tags == 'error' %}red{% else %}green{% endif %}; margin-bottom: 15px; padding: 10px; border-radius: 5px;">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
          <form method="POST">
              {% csrf_token %}
              <div class="mb-3">
                  <input type="text" id="fullname" name="fullname" placeholder="Fullname" required>
              </div>
              <div class="mb-3">
                <input type="text" id="username" name="username" placeholder="Username" required>
              </div>
              <div class="mb-3">
                  <input type="email" id="email" name="email" placeholder="Email" required>
              </div>
              <div class="mb-3">
                <input type="password" id="password" name="password" placeholder="Password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>
          <p class="text-center mt-3">Already have an account? <a href="/user_login">Login</a></p>
      </div>
  </div>

    <!-- Load Lottie Animation -->
    <script>
        var animation = lottie.loadAnimation({
          container: document.getElementById('lottie-animation'),
          renderer: 'svg',
          loop: true,
          autoplay: true,
          path: '/media/assets/animation.json'  // Replace with your file path
        });
    </script>

</body>

</html>
